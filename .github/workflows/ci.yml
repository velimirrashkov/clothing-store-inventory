name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clothing_store
          POSTGRES_USER: clothing_store
          POSTGRES_PASSWORD: clothing_store
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clothing_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-secret-key
      POSTGRES_DB: clothing_store
      POSTGRES_USER: clothing_store
      POSTGRES_PASSWORD: clothing_store
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt

      - run: pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy apps config || true # Phase 1 seam — tighten once app surface stabilizes

      - name: Migrations are in sync with models
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate
        run: python manage.py migrate

      - name: Test
        run: python -m pytest --cov=apps --cov-report=term-missing
