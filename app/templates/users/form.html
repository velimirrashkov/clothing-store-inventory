{% extends "base.html" %}
{% block content %}

<div class="panel">
  <h2>{% if user %}{{ t("users.edit_title") }}{% else %}{{ t("users.new_title") }}{% endif %}</h2>

  <form method="post" action="{% if user %}/users/{{ user.id }}/edit{% else %}/users/new{% endif %}">
    <div class="row">
      <div class="field">
        <label for="username">{{ t("auth.username") }}</label>
        <input type="text" id="username" name="username" required value="{{ user.username if user else '' }}">
      </div>
      <div class="field">
        <label for="role">{{ t("users.col_role") }}</label>
        <select id="role" name="role">
          {% for r in roles %}
          <option value="{{ r }}" {% if user and user.role == r %}selected{% endif %}>{{ t("role." + r) }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="field">
      <label for="password">{{ t("auth.password") }}</label>
      <input type="password" id="password" name="password" {% if not user %}required{% endif %}>
      {% if user %}<span class="muted">{{ t("users.password_help") }}</span>{% endif %}
    </div>

    <div class="actions">
      <button class="button" type="submit">{% if user %}{{ t("common.save") }}{% else %}{{ t("users.create") }}{% endif %}</button>
      <a class="button secondary" href="/users">{{ t("common.cancel") }}</a>
    </div>
  </form>
</div>

{% endblock %}
