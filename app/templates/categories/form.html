{% extends "base.html" %}
{% block content %}

<div class="panel">
  <h2>{% if category %}{{ t("categories.edit_title") }}{% else %}{{ t("categories.new_title") }}{% endif %}</h2>

  <form method="post" action="{% if category %}/categories/{{ category.id }}/edit{% else %}/categories/new{% endif %}">
    <div class="row">
      <div class="field">
        <label for="name">{{ t("common.name") }}</label>
        <input type="text" id="name" name="name" required value="{{ category.name if category else '' }}">
      </div>
      <div class="field">
        <label for="parent_id">{{ t("categories.parent") }}</label>
        <select id="parent_id" name="parent_id">
          <option value="">{{ t("categories.top_level") }}</option>
          {% for c in categories %}
          <option value="{{ c.id }}" {% if category and category.parent_id == c.id %}selected{% endif %}>{{ c.full_name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="actions">
      <button class="button" type="submit">{% if category %}{{ t("common.save") }}{% else %}{{ t("categories.create") }}{% endif %}</button>
      <a class="button secondary" href="/categories">{{ t("common.cancel") }}</a>
    </div>
  </form>
</div>

{% endblock %}
